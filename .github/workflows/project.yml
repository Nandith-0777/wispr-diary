name: Publish prepared source
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Verify and unpack the reviewed source package
        run: |
          python - <<'PY'
          import hashlib, pathlib, zipfile
          archive = pathlib.Path('source-bootstrap.zip')
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == '57f6c8ae053281687af45dd4be4c437851b3e137d194eac6804633ae6acaff89', 'Source package checksum mismatch'
          with zipfile.ZipFile(archive) as source:
              for entry in source.infolist():
                  name = pathlib.PurePosixPath(entry.filename)
                  assert not name.is_absolute() and not any(p in ('..', '.git', '.github') for p in name.parts), 'Invalid source path'
              source.extractall('.')
          PY
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
      - name: Publish the source and remove the temporary archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm source-bootstrap.zip
          git add --all
          git commit -m "Publish Wispr Diary source and narrated demo"
          git push origin HEAD:main
